appId: com.prisma.pos
productName: Prisma
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - resources/**
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Prisma
mac:
  target:
    - dmg
  category: public.app-category.business
