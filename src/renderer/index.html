<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          if (localStorage.getItem('prisma:theme') === 'light') {
            document.documentElement.classList.remove('dark')
          }
          var accent = localStorage.getItem('prisma:accent') || '#0070f3'
          var h = accent.replace('#', '')
          var num = parseInt(h.length === 3 ? h.split('').map(function (c) { return c + c }).join('') : h, 16)
          var r = (num >> 16) & 255
          var g = (num >> 8) & 255
          var b = num & 255
          document.documentElement.style.setProperty('--accent', r + ' ' + g + ' ' + b)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
